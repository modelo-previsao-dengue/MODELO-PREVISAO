name: Atualização Semanal — Pipeline Completo

# Roda toda segunda-feira às 06:00 UTC (03:00 Brasília).
# Baixa dados novos do SINAN + INMET, roda pipeline v4 completo,
# sobe resultados atualizados pro HuggingFace e atualiza Kaggle.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install "huggingface_hub>=0.25"

      - name: Baixar dados existentes do HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'EOF'
          from huggingface_hub import snapshot_download
          import os
          snapshot_download(
              "pedrolucassantanaf/dengue-tcc2-data",
              repo_type="dataset",
              local_dir=".",
              token=os.environ["HF_TOKEN"],
          )
          EOF

      - name: Fetch dados novos SINAN
        run: python3 scripts/fetch_weekly_data.py --year $(date +%Y) --skip-inmet

      - name: Processar SINAN bruto para gold
        run: |
          cd scripts
          python3 sinan_tcc2_pipeline.py --skip-bronze 2>&1 || echo "::warning::SINAN completo indisponivel, usando gold existente do HF"
          cd ..
        continue-on-error: true

      - name: Pipeline v4 (agregar + treinar + avaliar)
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          for s in 4[0-9]_*.py 5[0-5]_*.py; do
            echo "########## $s  ($(date +%H:%M:%S))"
            python3 "$s" || { echo "::error::$s falhou"; exit 1; }
          done
          echo "########## fim ($(date +%H:%M:%S))"
          cd ..

      - name: Upload resultados para HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/upload_data_to_hf.py --tudo

      - name: Atualizar notebooks no Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install kaggle
          python3 scripts/publish_kaggle.py

      - name: Resumo
        run: |
          echo "=== Atualização semanal completa ==="
          echo "Data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HF: https://huggingface.co/datasets/pedrolucassantanaf/dengue-tcc2-data"
          python3 scripts/status_hf.py || true
