name: Sync to HuggingFace

on:
  push:
    branches: [main]
    paths:
      - 'data/model_ready_v4/**'
      - 'models/regression_v4/**'
      - 'models/classification_v4/**'
      - 'dashboard/data/**'
      - 'data/geojson/**'
      - 'config/recorte.json'
      - 'hf_dataset_card/README.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface_hub pyarrow

      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/upload_data_to_hf.py --tudo
