name: Sync to HuggingFace

# Dados grandes (parquets, modelos) nao estao no Git (estao no .gitignore).
# Para upload completo (~4 GB), rode localmente: make publish-hf
# Este workflow sobe apenas os arquivos tracked pelo Git (configs, schemas, README).
# Use workflow_dispatch para forcar re-sync apos um make publish-hf local.

on:
  push:
    branches: [main]
    paths:
      - 'hf_dataset_card/README.md'
      - 'config/recorte.json'
      - 'data/geojson/**'
      - 'scripts/upload_data_to_hf.py'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "huggingface_hub>=0.25" pyarrow

      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/upload_data_to_hf.py --tudo
